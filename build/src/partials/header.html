<header class="header" data-header>
  <div class="header__inner">
    <a class="brand" href="index.html" aria-label="{{SITE_NAME}} — home">
      <svg class="brand__mark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
        <rect x="1" y="1" width="38" height="38" rx="3" fill="none" stroke="rgba(255,255,255,.16)"/>
        <path fill="#E39B26" fill-rule="evenodd"
              d="M8 6H27L31 10V17L27 21H24.5L32 34H23.5L16 21H14V34H8V6ZM14 11H23V16H14V11Z"/>
      </svg>
      <span class="brand__text">
        <span class="brand__name">Relyc Contractor</span>
        <span class="brand__sub">FL GC · {{LICENSE}}</span>
      </span>
    </a>

    <nav class="nav" aria-label="Primary">
          {{NAV}}
    </nav>

    <div class="header__cta">
      <a class="header__phone" href="tel:{{PHONE_HREF}}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>
        {{PHONE}}
      </a>
      <a class="btn btn--primary" href="contact.html">Request a Consultation</a>
      <button class="burger" type="button" data-burger aria-label="Open menu" aria-expanded="false" aria-controls="site-drawer">
        <span></span><span></span>
      </button>
    </div>
  </div>
</header>

<div class="drawer" id="site-drawer" data-drawer aria-hidden="true">
  <nav class="drawer__nav" aria-label="Mobile">
            {{DRAWER_NAV}}
  </nav>
  <div class="drawer__foot">
    <a class="btn btn--primary btn--full" href="contact.html">Request a Consultation</a>
    <div class="drawer__contact">
      <a href="tel:{{PHONE_HREF}}">{{PHONE}}</a>
      <a href="mailto:{{EMAIL}}">{{EMAIL}}</a>
      <span>{{STREET}}, {{CITY}}, {{REGION}} {{POSTAL}}</span>
    </div>
  </div>
</div>
